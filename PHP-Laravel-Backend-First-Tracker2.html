<style>

  body {

  header {
    position: sticky;
    top: 0;
    z-index: 10;

    background: var(--panel-2);
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done));
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 4px;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .phase {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .phase-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .phase-header:active { background: var(--panel-2); }
  .phase-title { font-weight: 700; font-size: 1rem; }
  .phase-dates { color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .chevron { transition: transform 0.2s ease; color: var(--muted); font-size: 0.9rem; }
  .phase.open .chevron { transform: rotate(90deg); }
  .phase-body { display: none; padding: 0 16px 16px 16px; }
  .phase.open .phase-body { display: block; }
  .block { border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); overflow: hidden; }
  .day-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .day-row:last-child { border-bottom: none; }
  .day-row.checkpoint { background: rgba(201,139,240,0.1); }
  .day-row input[type=checkbox] {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--done);
  }
  .day-tag {
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 700;
    white-space: nowrap;
    min-width: 68px;
    padding-top: 1px;
  }
  .day-content { flex: 1; }
  .day-topic { font-size: 0.85rem; font-weight: 600; }
  .day-task { font-size: 0.8rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .day-cs {
    font-size: 0.74rem;
    color: var(--cs);
    margin-top: 4px;
    line-height: 1.35;
    padding-top: 4px;
    border-top: 1px dashed var(--border);
  }
  .day-row.checked .day-topic,
  .day-row.checked .day-task,
  .day-row.checked .day-cs {
    text-decoration: line-through;
    color: #5c6070;
  }
  .checkpoint-badge {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    color: #0f1115;
    background: var(--checkpoint);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .phase-progress { font-size: 0.72rem; color: var(--muted); min-width: 40px; text-align: right; }
  footer { max-width: 760px; margin: 0 auto; padding: 10px 16px 30px 16px; text-align: center; }
  .reset-btn {
    background: var(--panel);
    color: var(--danger);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--panel-2); }
  .legend {
    display: flex;
    gap: 16px;
    padding: 8px 16px 0 16px;
    font-size: 0.72rem;
    color: var(--muted);
    max-width: 760px;
    margin: 0 auto;
    flex-wrap: wrap;

  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.cs { background: var(--cs); }
  .dot.checkpoint { background: var(--checkpoint); }
</style>

const STORAGE_KEY = "php-laravel-curriculum-progress-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();

function dayKey(phaseId, idx) { return `${phaseId}:${idx}`; }

function renderPhase(phase) {
  const rows = phase.days.map((d, idx) => {
    const key = dayKey(phase.id, idx);
    const checked = !!state[key];
    return `
      <div class="day-row ${checked ? "checked" : ""} ${d.checkpoint ? "checkpoint" : ""}" data-key="${key}">
        <input type="checkbox" ${checked ? "checked" : ""} data-key="${key}">
        <div class="day-tag">${d.tag}</div>
        <div class="day-content">
          <div class="day-topic">${d.topic}${d.checkpoint ? '<span class="checkpoint-badge">CHECKPOINT</span>' : ''}</div>
          <div class="day-task">${d.task}</div>
          <div class="day-cs">${d.cs}</div>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="phase" id="${phase.id}">
      <div class="phase-header" data-toggle="${phase.id}">
        <div>
          <div class="phase-title">${phase.title}</div>
          <div class="phase-dates">${phase.dates}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="phase-progress">—</span>
          <span class="chevron">▶</span>
        </div>
      </div>
      <div class="phase-body">
        <div class="block">${rows}</div>
      </div>
    </div>
  `;
}

function countTotalsForPhase(phase) {
  let total = 0, done = 0;
  phase.days.forEach((d, idx) => {
    total++;
    if (state[dayKey(phase.id, idx)]) done++;
  });
  return { total, done };
}

function renderAll() {
  const main = document.getElementById("main");
  main.innerHTML = DATA.map(renderPhase).join("");

  document.querySelectorAll(".phase-header").forEach(header => {
    header.addEventListener("click", () => {
      const phase = header.closest(".phase");
      phase.classList.toggle("open");
    });
  });

  document.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const key = e.target.getAttribute("data-key");
      state[key] = e.target.checked;
      saveState(state);
      e.target.closest(".day-row").classList.toggle("checked", e.target.checked);
      updateProgress();
      updatePhaseCounters();
    });
  });

  const first = document.querySelector(".phase");
  if (first) first.classList.add("open");

  updateProgress();
  updatePhaseCounters();
}

function updatePhaseCounters() {
  DATA.forEach(phase => {
    const { total, done } = countTotalsForPhase(phase);
    const el = document.querySelector(`#${phase.id} .phase-progress`);
    if (el) el.textContent = total > 0 ? `${done}/${total}` : "—";
  });
}

function updateProgress() {
  let total = 0, done = 0;
  DATA.forEach(phase => {
    const c = countTotalsForPhase(phase);
    total += c.total;
    done += c.done;
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${done} / ${total} done`;
  document.getElementById("progressPct").textContent = pct + "%";
}

function resetAll() {
  if (!confirm("Reset all checked progress? This cannot be undone.")) return;
  state = {};
  saveState(state);
  renderAll();
}

renderAll();

</script>
